[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yapping-bot"
version = "0.1.0"
description = "Automation service for generating crypto yapping posts."
authors = [{name = "Max"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "feedparser>=6.0.11",
    "tzdata>=2023.3",
    "requests-oauthlib>=1.3.1",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "playwright>=1.45.0",
    "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
